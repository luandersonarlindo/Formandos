# Blueprint do Render: cria o banco PostgreSQL e o serviço web do Formandos.
# Passo a passo em docs/deploy-render.md.
#
# Aviso: o PostgreSQL do plano gratuito expira 30 dias depois de criado
# (mais 14 dias de carência, depois o banco e os dados são apagados).
databases:
  - name: formandos-db
    plan: free
    region: virginia
    databaseName: formandos
    user: formandos

services:
  - type: web
    name: formandos
    runtime: node
    plan: free
    region: virginia # precisa ser a mesma do banco
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /entrar
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Conexão interna do Render (não sai da rede privada).
      - key: DATABASE_URL
        fromDatabase:
          name: formandos-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # BETTER_AUTH_URL é opcional: sem ela o app usa RENDER_EXTERNAL_URL,
      # que o Render define com o endereço público do serviço.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
